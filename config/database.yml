# PostgreSQL. 큐(Solid Queue) 테이블도 이 DB에 둔다(docs/adr/0002).
#
# 개발과 시험은 `bin/pg start`가 띄우는 프로젝트 안의 PostgreSQL(tmp/pg, 소켓 접속)을 기본으로 쓴다.
# 다른 서버를 쓰려면 PGHOST, PGPORT, PGUSER, PGPASSWORD를 정한다.
# 운영은 DATABASE_URL 또는 ANSWER_DESK_DATABASE_PASSWORD로 정한다. 비밀값은 이 파일에 쓰지 않는다.
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

local: &local
  <<: *default
  host: <%= ENV.fetch("PGHOST") { File.expand_path("../tmp/pg", __dir__) } %>
  port: <%= ENV.fetch("PGPORT") { 5439 } %>

development:
  <<: *local
  database: answer_desk_development

# 이 DB는 시험을 돌릴 때마다 개발 스키마로 다시 만들어진다. 개발·운영과 같은 이름을 쓰지 않는다.
test:
  <<: *local
  database: answer_desk_test

production:
  <<: *default
  database: answer_desk_production
  username: answer_desk
  password: <%= ENV["ANSWER_DESK_DATABASE_PASSWORD"] %>
