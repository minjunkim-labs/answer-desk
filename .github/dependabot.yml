# Copy to .github/dependabot.yml. Add one block per package manager from dependabot-ecosystem.yml.
version: 2
updates:
  # Workflow actions are pinned to full SHAs; this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    # Wait a week before proposing a newly published version: fresh releases are where hijacked packages show up.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      # CodeQL fails unless init and analyze run the same version.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
  # Rails 앱의 gem(Gemfile.lock). 새로 나온 버전은 일주일 기다린다.
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
