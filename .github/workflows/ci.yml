# From repo-baseline templates/github/ci.yml. The check and test steps run the AGENTS.md commands;
# add the toolchain setup the app needs before them.
# Pin every action to a full commit SHA. Dependabot (github-actions) keeps the pins current.
# To cache dependencies, use the setup action's own cache option (for example setup-node
# `cache: npm`). It keys the cache on the lockfile hash.
name: ci

on:
  pull_request:
  # The merge queue tests the queued result here; without it a queued PR never merges.
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run. Other runs get their own group
# (run_id), so a newer run never cancels or replaces a pending run on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # This job name is the required check context in repository-settings.json.
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # AGENTS.md lists check and test as N/A until the Rails app exists; that PR replaces these steps.
      - name: check
        run: echo "N/A in AGENTS.md - no code yet"
      - name: test
        run: echo "N/A in AGENTS.md - no code yet"
